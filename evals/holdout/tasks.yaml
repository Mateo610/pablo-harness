    gradebook/compute.py: |
      """Turning scores into percentages and letters."""

      from decimal import ROUND_HALF_UP, Decimal

      from gradebook.book import Gradebook
      from gradebook.models import Score
      from gradebook.policy import Policy


      def earned(score: Score, max_points: float, policy: Policy) -> float:
          """Points after the late penalty, never below zero."""
          penalty = score.points * policy.late_penalty * score.late_days
          return max(0.0, score.points - penalty) / max_points


      def category_average(book: Gradebook, student_id: str, category: str, policy: Policy) -> float | None:
          """Mean fraction (0..1) over the graded assignments in a category; None if none are graded."""
          fractions = []
          for score in book.scores_for(student_id):
              assignment = book.assignments[score.assignment_id]
              if assignment.category == category:
                  fractions.append(earned(score, assignment.max_points, policy))
          if not fractions:
              return None
          return sum(fractions) / len(fractions)


      def final_percent(book: Gradebook, student_id: str, policy: Policy) -> float:
          total = 0.0
          for category, weight in policy.weights.items():
              avg = category_average(book, student_id, category, policy)
              if avg is not None:
                  total += avg * weight
          return total * 100


      def percent_text(percent: float) -> str:
          """One decimal, halves rounded up (84.95 -> 85.0), ignoring float noise."""
          return str(Decimal(f"{percent:.6f}").quantize(Decimal("0.1"), rounding=ROUND_HALF_UP))


      def letter(percent: float) -> str:
          if percent >= 90:
              return "A"
          if percent >= 80:
              return "B"
          if percent >= 70:
              return "C"
          if percent >= 60:
              return "D"
          return "F"
    gradebook/csvio.py: |
      """Rosters and scores from CSV text, and the grade export."""

      import csv
      import io

      from gradebook.book import Gradebook
      from gradebook.compute import final_percent, letter, percent_text
      from gradebook.models import Score, Student
      from gradebook.policy import Policy


      def load_roster(text: str, book: Gradebook) -> None:
          """Columns: id,name"""
          for row in csv.DictReader(io.StringIO(text)):
              book.add_student(Student(row["id"].strip(), row["name"].strip()))


      def load_scores(text: str, book: Gradebook) -> None:
          """Columns: student,assignment,points[,late_days]"""
          for row in csv.DictReader(io.StringIO(text)):
              book.record(
                  Score(
                      student_id=row["student"].strip(),
                      assignment_id=row["assignment"].strip(),
                      points=float(row["points"]),
                      late_days=int(row.get("late_days") or 0),
                  )
              )


      def export_grades(book: Gradebook, policy: Policy) -> str:
          """One row per student, sorted by id: id,name,percent,letter"""
          out = io.StringIO()
          writer = csv.writer(out, lineterminator="\n")
          writer.writerow(["id", "name", "percent", "letter"])
          for sid in sorted(book.students):
              pct = final_percent(book, sid, policy)
              writer.writerow([sid, book.students[sid].name, percent_text(pct), letter(pct)])
          return out.getvalue()
    gradebook/report.py: |
      """Readable reports for one student or the whole class."""

      from gradebook.book import Gradebook
      from gradebook.compute import category_average, final_percent, letter, percent_text
      from gradebook.policy import Policy


      def student_report(book: Gradebook, student_id: str, policy: Policy) -> str:
          student = book.students[student_id]
          lines = [f"{student.name} ({student.id})"]
          for category in policy.weights:
              avg = category_average(book, student_id, category, policy)
              shown = "-" if avg is None else f"{percent_text(avg * 100)}%"
              lines.append(f"  {category}: {shown}")
          pct = final_percent(book, student_id, policy)
          lines.append(f"  final: {percent_text(pct)}% {letter(pct)}")
          return "\n".join(lines)


      def class_summary(book: Gradebook, policy: Policy) -> dict[str, object]:
          percents = sorted(final_percent(book, sid, policy) for sid in book.students)
          letters: dict[str, int] = {}
          for p in percents:
              letters[letter(p)] = letters.get(letter(p), 0) + 1
          return {
              "students": len(percents),
              "mean": sum(percents) / len(percents) if percents else 0.0,
              "median": percents[len(percents) // 2] if percents else 0.0,
              "letters": letters,
          }
