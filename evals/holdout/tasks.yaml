  solution:
    gradebook/models.py: |
      """The records a gradebook keeps."""

      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Student:
          id: str
          name: str


      @dataclass(frozen=True)
      class Assignment:
          id: str
          title: str
          category: str  # homework, quiz, exam, ...
          max_points: float
          due: str  # YYYY-MM-DD


      @dataclass(frozen=True)
      class Score:
          student_id: str
          assignment_id: str
          points: float
          late_days: int = 0
          excused: bool = False  # doesn't count toward the average at all
    gradebook/csvio.py: |
      """Rosters and scores from CSV text, and the grade export."""

      import csv
      import io

      from gradebook.book import Gradebook
      from gradebook.compute import final_percent, letter
      from gradebook.models import Score, Student
      from gradebook.policy import Policy


      def load_roster(text: str, book: Gradebook) -> None:
          """Columns: id,name"""
          for row in csv.DictReader(io.StringIO(text)):
              book.add_student(Student(row["id"].strip(), row["name"].strip()))


      def load_scores(text: str, book: Gradebook) -> None:
          """Columns: student,assignment,points[,late_days]"""
          for row in csv.DictReader(io.StringIO(text)):
              raw = row["points"].strip()
              excused = raw.upper() == "EX"
              book.record(
                  Score(
                      student_id=row["student"].strip(),
                      assignment_id=row["assignment"].strip(),
                      points=0.0 if excused else float(raw),
                      late_days=int(row.get("late_days") or 0),
                      excused=excused,
                  )
              )


      def export_grades(book: Gradebook, policy: Policy) -> str:
          """One row per student, sorted by id: id,name,percent,letter"""
          out = io.StringIO()
          writer = csv.writer(out, lineterminator="\n")
          writer.writerow(["id", "name", "percent", "letter"])
          for sid in sorted(book.students):
              pct = final_percent(book, sid, policy)
              writer.writerow([sid, book.students[sid].name, f"{pct:.1f}", letter(pct)])
          return out.getvalue()
    gradebook/compute.py: |
      """Turning scores into percentages and letters."""

      from gradebook.book import Gradebook
      from gradebook.models import Score
      from gradebook.policy import Policy


      def earned(score: Score, max_points: float, policy: Policy) -> float:
          """Points after the late penalty, never below zero."""
          penalty = score.points * policy.late_penalty * score.late_days
          return max(0.0, score.points - penalty) / max_points


      def category_average(book: Gradebook, student_id: str, category: str, policy: Policy) -> float | None:
          """Mean fraction (0..1) over the graded assignments in a category; None if none are graded."""
          fractions = []
          for score in book.scores_for(student_id):
              assignment = book.assignments[score.assignment_id]
              if assignment.category == category and not score.excused:
                  fractions.append(earned(score, assignment.max_points, policy))
          if not fractions:
              return None
          return sum(fractions) / len(fractions)


      def final_percent(book: Gradebook, student_id: str, policy: Policy) -> float:
          total = 0.0
          for category, weight in policy.weights.items():
              avg = category_average(book, student_id, category, policy)
              if avg is not None:
                  total += avg * weight
          return total * 100


      def letter(percent: float) -> str:
          if percent >= 90:
              return "A"
          if percent >= 80:
              return "B"
          if percent >= 70:
              return "C"
          if percent >= 60:
              return "D"
          return "F"
- id: holdout-graded-weights
  repo: gradebook
  refs: symbol
  kind: bugfix
  task: 'final_percent quietly counts a category with nothing graded yet as zero, so a student who has
    only homework graded early in the term gets a tiny percent. Spread the weight over the categories
    that do have graded work instead: the result should be the weighted average of the graded categories
    only (0 when nothing is graded).'
  hidden: |
    from gradebook.book import Gradebook
    from gradebook.models import Assignment, Score, Student


    def make(*assignments, students=("s1",)):
        b = Gradebook()
        for sid in students:
            b.add_student(Student(sid, sid.upper()))
        for a in assignments:
            b.add_assignment(Assignment(*a))
        return b
    from gradebook.compute import final_percent
    from gradebook.policy import load_policy


    def test_only_graded_categories_count() -> None:
        b = make(("h1", "H1", "homework", 10, "2026-09-01"), ("e1", "E1", "exam", 100, "2026-10-01"),
                 students=("s1", "s2"))
        b.record(Score("s1", "h1", 9))
        policy = load_policy({"weights": {"homework": 0.4, "exam": 0.6}})
        assert round(final_percent(b, "s1", policy), 1) == 90.0
        assert final_percent(b, "s2", policy) == 0.0
        b.record(Score("s1", "e1", 50))
        assert round(final_percent(b, "s1", policy), 1) == 66.0
  solution:
    gradebook/compute.py: |
      """Turning scores into percentages and letters."""

      from gradebook.book import Gradebook
      from gradebook.models import Score
      from gradebook.policy import Policy


      def earned(score: Score, max_points: float, policy: Policy) -> float:
          """Points after the late penalty, never below zero."""
          penalty = score.points * policy.late_penalty * score.late_days
          return max(0.0, score.points - penalty) / max_points


      def category_average(book: Gradebook, student_id: str, category: str, policy: Policy) -> float | None:
          """Mean fraction (0..1) over the graded assignments in a category; None if none are graded."""
          fractions = []
          for score in book.scores_for(student_id):
              assignment = book.assignments[score.assignment_id]
              if assignment.category == category:
                  fractions.append(earned(score, assignment.max_points, policy))
          if not fractions:
              return None
          return sum(fractions) / len(fractions)


      def final_percent(book: Gradebook, student_id: str, policy: Policy) -> float:
          total = 0.0
          graded_weight = 0.0
          for category, weight in policy.weights.items():
              avg = category_average(book, student_id, category, policy)
              if avg is not None:
                  total += avg * weight
                  graded_weight += weight
          if graded_weight == 0:
              return 0.0
          return total / graded_weight * 100


      def letter(percent: float) -> str:
          if percent >= 90:
              return "A"
          if percent >= 80:
              return "B"
          if percent >= 70:
              return "C"
          if percent >= 60:
              return "D"
          return "F"
- id: holdout-policy-scale
  repo: gradebook
  refs: none
  kind: feature
  task: 'Let the grading policy set the letter boundaries. A policy may include "scale", for example {"A":
    93, "B": 85, "C": 75, "D": 65}: each letter with its minimum percent. Without it, today''s 90/80/70/60
    scale applies. The CSV export, the student report and the class summary should all use the policy''s
    scale.'
  hidden: |
    from gradebook.book import Gradebook
    from gradebook.models import Assignment, Score, Student


    def make(*assignments, students=("s1",)):
        b = Gradebook()
        for sid in students:
            b.add_student(Student(sid, sid.upper()))
        for a in assignments:
            b.add_assignment(Assignment(*a))
        return b
    from gradebook.csvio import export_grades
    from gradebook.policy import load_policy
    from gradebook.report import class_summary, student_report


    def test_policy_scale() -> None:
        b = make(("e1", "E1", "exam", 100, "2026-10-01"), students=("s1", "s2"))
        b.record(Score("s1", "e1", 88))
        b.record(Score("s2", "e1", 92))
        strict = load_policy({"weights": {"exam": 1.0}, "scale": {"A": 93, "B": 85, "C": 75, "D": 65}})
        assert export_grades(b, strict).splitlines()[1:] == ["s1,S1,88.0,B", "s2,S2,92.0,B"]
        assert "88.0% B" in student_report(b, "s1", strict)
        assert class_summary(b, strict)["letters"] == {"B": 2}
        plain = load_policy({"weights": {"exam": 1.0}})
        assert export_grades(b, plain).splitlines()[1:] == ["s1,S1,88.0,B", "s2,S2,92.0,A"]
  solution:
    gradebook/policy.py: |
      """How scores turn into a grade: category weights and the late penalty."""

      from dataclasses import dataclass, field
      from typing import Any


      @dataclass(frozen=True)
      class Policy:
          weights: dict[str, float]  # category -> weight; the weights add up to 1
          late_penalty: float = 0.1  # fraction of the points lost per late day
          drop_lowest: dict[str, int] = field(default_factory=dict)  # category -> how many to drop
          scale: dict[str, float] | None = None  # letter -> minimum percent; None: 90/80/70/60


      def load_policy(data: dict[str, Any]) -> Policy:
          weights = {str(k): float(v) for k, v in data["weights"].items()}
          if abs(sum(weights.values()) - 1.0) > 1e-6:
              raise ValueError("weights must add up to 1")
          return Policy(
              weights=weights,
              late_penalty=float(data.get("late_penalty", 0.1)),
              drop_lowest={str(k): int(v) for k, v in data.get("drop_lowest", {}).items()},
              scale={str(k): float(v) for k, v in data["scale"].items()} if "scale" in data else None,
          )
    gradebook/compute.py: |
      """Turning scores into percentages and letters."""

      from gradebook.book import Gradebook
      from gradebook.models import Score
      from gradebook.policy import Policy


      def earned(score: Score, max_points: float, policy: Policy) -> float:
          """Points after the late penalty, never below zero."""
          penalty = score.points * policy.late_penalty * score.late_days
          return max(0.0, score.points - penalty) / max_points


      def category_average(book: Gradebook, student_id: str, category: str, policy: Policy) -> float | None:
          """Mean fraction (0..1) over the graded assignments in a category; None if none are graded."""
          fractions = []
          for score in book.scores_for(student_id):
              assignment = book.assignments[score.assignment_id]
              if assignment.category == category:
                  fractions.append(earned(score, assignment.max_points, policy))
          if not fractions:
              return None
          return sum(fractions) / len(fractions)


      def final_percent(book: Gradebook, student_id: str, policy: Policy) -> float:
          total = 0.0
          for category, weight in policy.weights.items():
              avg = category_average(book, student_id, category, policy)
              if avg is not None:
                  total += avg * weight
          return total * 100


      DEFAULT_SCALE = {"A": 90.0, "B": 80.0, "C": 70.0, "D": 60.0}


      def letter(percent: float, scale: dict[str, float] | None = None) -> str:
          """The best letter whose minimum the percent reaches; F below every minimum."""
          for name, minimum in sorted((scale or DEFAULT_SCALE).items(), key=lambda kv: -kv[1]):
              if percent >= minimum:
                  return name
          return "F"
    gradebook/csvio.py: |
      """Rosters and scores from CSV text, and the grade export."""

      import csv
      import io

      from gradebook.book import Gradebook
      from gradebook.compute import final_percent, letter
      from gradebook.models import Score, Student
      from gradebook.policy import Policy


      def load_roster(text: str, book: Gradebook) -> None:
          """Columns: id,name"""
          for row in csv.DictReader(io.StringIO(text)):
              book.add_student(Student(row["id"].strip(), row["name"].strip()))


      def load_scores(text: str, book: Gradebook) -> None:
          """Columns: student,assignment,points[,late_days]"""
          for row in csv.DictReader(io.StringIO(text)):
              book.record(
                  Score(
                      student_id=row["student"].strip(),
                      assignment_id=row["assignment"].strip(),
                      points=float(row["points"]),
                      late_days=int(row.get("late_days") or 0),
                  )
              )


      def export_grades(book: Gradebook, policy: Policy) -> str:
          """One row per student, sorted by id: id,name,percent,letter"""
          out = io.StringIO()
          writer = csv.writer(out, lineterminator="\n")
          writer.writerow(["id", "name", "percent", "letter"])
          for sid in sorted(book.students):
              pct = final_percent(book, sid, policy)
              writer.writerow([sid, book.students[sid].name, f"{pct:.1f}", letter(pct, policy.scale)])
          return out.getvalue()
    gradebook/report.py: |
      """Readable reports for one student or the whole class."""

      from gradebook.book import Gradebook
      from gradebook.compute import category_average, final_percent, letter
      from gradebook.policy import Policy


      def student_report(book: Gradebook, student_id: str, policy: Policy) -> str:
          student = book.students[student_id]
          lines = [f"{student.name} ({student.id})"]
          for category in policy.weights:
              avg = category_average(book, student_id, category, policy)
              shown = "-" if avg is None else f"{avg * 100:.1f}%"
              lines.append(f"  {category}: {shown}")
          pct = final_percent(book, student_id, policy)
          lines.append(f"  final: {pct:.1f}% {letter(pct, policy.scale)}")
          return "\n".join(lines)


      def class_summary(book: Gradebook, policy: Policy) -> dict[str, object]:
          percents = sorted(final_percent(book, sid, policy) for sid in book.students)
          letters: dict[str, int] = {}
          for p in percents:
              grade = letter(p, policy.scale)
              letters[grade] = letters.get(grade, 0) + 1
          return {
              "students": len(percents),
              "mean": sum(percents) / len(percents) if percents else 0.0,
              "median": percents[len(percents) // 2] if percents else 0.0,
              "letters": letters,
          }
- id: holdout-median-even
  repo: gradebook
  refs: file
  kind: bugfix
  task: In gradebook/report.py, class_summary reports the wrong median when the class has an even number
    of students. With an even count it should be the mean of the two middle percents.
  hidden: |
    from gradebook.book import Gradebook
    from gradebook.models import Assignment, Score, Student


    def make(*assignments, students=("s1",)):
        b = Gradebook()
        for sid in students:
            b.add_student(Student(sid, sid.upper()))
        for a in assignments:
            b.add_assignment(Assignment(*a))
        return b
    from gradebook.policy import load_policy
    from gradebook.report import class_summary


    def test_even_median() -> None:
        b = make(("e1", "E1", "exam", 100, "2026-10-01"), students=("s1", "s2", "s3", "s4"))
        for sid, pts in (("s1", 60), ("s2", 70), ("s3", 90), ("s4", 100)):
            b.record(Score(sid, "e1", pts))
        policy = load_policy({"weights": {"exam": 1.0}})
        assert class_summary(b, policy)["median"] == 80.0
        b.add_student(Student("s5", "S5"))
        b.record(Score("s5", "e1", 75))
        assert class_summary(b, policy)["median"] == 75.0
  solution:
    gradebook/report.py: |
      """Readable reports for one student or the whole class."""

      from gradebook.book import Gradebook
      from gradebook.compute import category_average, final_percent, letter
      from gradebook.policy import Policy


      def student_report(book: Gradebook, student_id: str, policy: Policy) -> str:
          student = book.students[student_id]
          lines = [f"{student.name} ({student.id})"]
          for category in policy.weights:
              avg = category_average(book, student_id, category, policy)
              shown = "-" if avg is None else f"{avg * 100:.1f}%"
              lines.append(f"  {category}: {shown}")
          pct = final_percent(book, student_id, policy)
          lines.append(f"  final: {pct:.1f}% {letter(pct)}")
          return "\n".join(lines)


      def class_summary(book: Gradebook, policy: Policy) -> dict[str, object]:
          percents = sorted(final_percent(book, sid, policy) for sid in book.students)
          letters: dict[str, int] = {}
          for p in percents:
              letters[letter(p)] = letters.get(letter(p), 0) + 1
          n = len(percents)
          if n == 0:
              median = 0.0
          elif n % 2:
              median = percents[n // 2]
          else:
              median = (percents[n // 2 - 1] + percents[n // 2]) / 2
          return {
              "students": n,
              "mean": sum(percents) / n if percents else 0.0,
              "median": median,
              "letters": letters,
          }
