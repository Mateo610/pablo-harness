    gradebook/policy.py: |
      """How scores turn into a grade: category weights and the late penalty."""

      from dataclasses import dataclass, field
      from typing import Any


      @dataclass(frozen=True)
      class Policy:
          weights: dict[str, float]  # category -> weight; the weights add up to 1
          late_penalty: float = 0.1  # fraction of the points lost per late day
          drop_lowest: dict[str, int] = field(default_factory=dict)  # category -> how many to drop
          extra_cap: float = 5.0  # most percentage points extra credit can add


      def load_policy(data: dict[str, Any]) -> Policy:
          weights = {str(k): float(v) for k, v in data["weights"].items()}
          if abs(sum(weights.values()) - 1.0) > 1e-6:
              raise ValueError("weights must add up to 1")
          return Policy(
              weights=weights,
              late_penalty=float(data.get("late_penalty", 0.1)),
              drop_lowest={str(k): int(v) for k, v in data.get("drop_lowest", {}).items()},
              extra_cap=float(data.get("extra_cap", 5.0)),
          )
    gradebook/compute.py: |
      """Turning scores into percentages and letters."""

      from gradebook.book import Gradebook
      from gradebook.models import Score
      from gradebook.policy import Policy


      def earned(score: Score, max_points: float, policy: Policy) -> float:
          """Points after the late penalty, never below zero."""
          penalty = score.points * policy.late_penalty * score.late_days
          return max(0.0, score.points - penalty) / max_points


      def category_average(book: Gradebook, student_id: str, category: str, policy: Policy) -> float | None:
          """Mean fraction (0..1) over the graded assignments in a category; None if none are graded."""
          fractions = []
          for score in book.scores_for(student_id):
              assignment = book.assignments[score.assignment_id]
              if assignment.category == category:
                  fractions.append(earned(score, assignment.max_points, policy))
          if not fractions:
              return None
          return sum(fractions) / len(fractions)


      def final_percent(book: Gradebook, student_id: str, policy: Policy) -> float:
          total = 0.0
          for category, weight in policy.weights.items():
              avg = category_average(book, student_id, category, policy)
              if avg is not None:
                  total += avg * weight
          extra = sum(
              earned(s, 1.0, policy)
              for s in book.scores_for(student_id)
              if book.assignments[s.assignment_id].category == "extra"
          )
          return total * 100 + min(extra, policy.extra_cap)


      def letter(percent: float) -> str:
          if percent >= 90:
              return "A"
          if percent >= 80:
              return "B"
          if percent >= 70:
              return "C"
          if percent >= 60:
              return "D"
          return "F"
