  solution:
    gradebook/book.py: |
      """The gradebook itself: who is enrolled, what was assigned, what they scored."""

      from gradebook.models import Assignment, Score, Student


      class Gradebook:
          def __init__(self) -> None:
              self.students: dict[str, Student] = {}
              self.assignments: dict[str, Assignment] = {}
              self.scores: list[Score] = []

          def add_student(self, student: Student) -> None:
              self.students[student.id] = student

          def add_assignment(self, assignment: Assignment) -> None:
              self.assignments[assignment.id] = assignment

          def record(self, score: Score) -> None:
              if score.student_id not in self.students:
                  raise KeyError(f"unknown student {score.student_id}")
              if score.assignment_id not in self.assignments:
                  raise KeyError(f"unknown assignment {score.assignment_id}")
              self.scores = [
                  s
                  for s in self.scores
                  if (s.student_id, s.assignment_id) != (score.student_id, score.assignment_id)
              ]
              self.scores.append(score)

          def scores_for(self, student_id: str) -> list[Score]:
              return [s for s in self.scores if s.student_id == student_id]

          def in_category(self, category: str) -> list[Assignment]:
              return [a for a in self.assignments.values() if a.category == category]

          def missing(self, as_of: str) -> list[tuple[str, str]]:
              """(student, assignment) pairs due before `as_of` (YYYY-MM-DD) with no score, sorted."""
              scored = {(s.student_id, s.assignment_id) for s in self.scores}
              return sorted(
                  (sid, a.id)
                  for sid in self.students
                  for a in self.assignments.values()
                  if a.due < as_of and (sid, a.id) not in scored
              )
    gradebook/cli.py: |
      """gradebook report|summary|missing --roster R.csv --scores S.csv --policy P.json
      [--student ID] [--as-of YYYY-MM-DD]"""

      import argparse
      import json
      import sys
      from pathlib import Path

      from gradebook.book import Gradebook
      from gradebook.csvio import load_roster, load_scores
      from gradebook.models import Assignment
      from gradebook.policy import load_policy
      from gradebook.report import class_summary, student_report


      def load(args: argparse.Namespace) -> tuple[Gradebook, object]:
          data = json.loads(Path(args.policy).read_text())
          book = Gradebook()
          for a in data.get("assignments", []):
              book.add_assignment(Assignment(a["id"], a["title"], a["category"], float(a["max_points"]), a["due"]))
          load_roster(Path(args.roster).read_text(), book)
          load_scores(Path(args.scores).read_text(), book)
          return book, load_policy(data)


      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(prog="gradebook")
          parser.add_argument("command", choices=["report", "summary", "missing"])
          parser.add_argument("--roster", required=True)
          parser.add_argument("--scores", required=True)
          parser.add_argument("--policy", required=True)
          parser.add_argument("--student")
          parser.add_argument("--as-of", dest="as_of")
          args = parser.parse_args(argv)
          book, policy = load(args)
          if args.command == "missing":
              if not args.as_of:
                  parser.error("missing needs --as-of YYYY-MM-DD")
              for sid, aid in book.missing(args.as_of):
                  print(f"{sid} {aid}")
          elif args.command == "report":
              ids = [args.student] if args.student else sorted(book.students)
              print("\n\n".join(student_report(book, sid, policy) for sid in ids))  # type: ignore[arg-type]
          else:
              print(json.dumps(class_summary(book, policy), sort_keys=True))  # type: ignore[arg-type]
          return 0


      if __name__ == "__main__":
          sys.exit(main())
