  refs: none
  kind: feature
  task: 'Teachers need to excuse a student from an assignment. In the scores CSV, a points value of EX
    means excused. An excused assignment doesn''t count toward that student''s average at all: it is neither
    a zero nor full marks.'
  hidden: |
