    from gradebook.csvio import load_scores
    from gradebook.policy import load_policy


    def test_excused() -> None:
        b = make(("h1", "H1", "homework", 10, "2026-09-01"), ("h2", "H2", "homework", 10, "2026-09-02"),
                 ("e1", "E1", "exam", 100, "2026-10-01"))
        load_scores("student,assignment,points\ns1,h1,8\ns1,h2,EX\ns1,e1,70\n", b)
