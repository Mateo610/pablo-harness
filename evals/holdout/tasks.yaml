# The holdout suite: harder, multi-file tasks on a seed repo the main suite never uses.
#
# Scored, never studied. `pablo eval --set holdout` prints only the totals and writes no
# per-task results and no judge replay, so nobody (person or model) tunes against these tasks.
# Look at a task here only to fix a broken hidden test, and say so in decisions.md.
#
# Same format as evals/suite/tasks.yaml: `hidden` runs after the diff with
# `python -I -m pytest --noconftest`; `solution` exists only for the self-test
# (tests/test_holdout.py). These tasks are never prompts or training data.
tasks:
- id: holdout-drop-lowest
  repo: gradebook
  refs: none
  kind: feature
  task: 'The policy''s drop_lowest setting is read but never used. Make it work: for each category, ignore
    that many of the student''s lowest graded scores before averaging, but always keep at least one.'
  hidden: |
    from gradebook.book import Gradebook
    from gradebook.models import Assignment, Score, Student


    def make(*assignments, students=("s1",)):
        b = Gradebook()
        for sid in students:
            b.add_student(Student(sid, sid.upper()))
        for a in assignments:
            b.add_assignment(Assignment(*a))
        return b
    from gradebook.compute import final_percent
    from gradebook.policy import load_policy


    def test_drop_lowest() -> None:
        b = make(("h1", "H1", "homework", 10, "2026-09-01"), ("h2", "H2", "homework", 10, "2026-09-02"),
                 ("h3", "H3", "homework", 10, "2026-09-03"))
        for aid, pts in (("h1", 2), ("h2", 8), ("h3", 10)):
            b.record(Score("s1", aid, pts))
        one = load_policy({"weights": {"homework": 1.0}, "drop_lowest": {"homework": 1}})
        assert round(final_percent(b, "s1", one), 1) == 90.0
        many = load_policy({"weights": {"homework": 1.0}, "drop_lowest": {"homework": 5}})
        assert round(final_percent(b, "s1", many), 1) == 100.0
        none = load_policy({"weights": {"homework": 1.0}})
        assert round(final_percent(b, "s1", none), 1) == 66.7
  solution:
    gradebook/compute.py: |
      """Turning scores into percentages and letters."""

      from gradebook.book import Gradebook
      from gradebook.models import Score
      from gradebook.policy import Policy


      def earned(score: Score, max_points: float, policy: Policy) -> float:
          """Points after the late penalty, never below zero."""
          penalty = score.points * policy.late_penalty * score.late_days
          return max(0.0, score.points - penalty) / max_points


      def category_average(book: Gradebook, student_id: str, category: str, policy: Policy) -> float | None:
          """Mean fraction (0..1) over the graded assignments in a category; None if none are graded."""
          fractions = []
          for score in book.scores_for(student_id):
              assignment = book.assignments[score.assignment_id]
              if assignment.category == category:
                  fractions.append(earned(score, assignment.max_points, policy))
          if not fractions:
              return None
          drop = min(policy.drop_lowest.get(category, 0), len(fractions) - 1)
          kept = sorted(fractions)[drop:]
          return sum(kept) / len(kept)


      def final_percent(book: Gradebook, student_id: str, policy: Policy) -> float:
          total = 0.0
          for category, weight in policy.weights.items():
              avg = category_average(book, student_id, category, policy)
              if avg is not None:
                  total += avg * weight
          return total * 100


      def letter(percent: float) -> str:
          if percent >= 90:
              return "A"
          if percent >= 80:
              return "B"
          if percent >= 70:
              return "C"
          if percent >= 60:
              return "D"
          return "F"
- id: holdout-late-cap
  repo: gradebook
  refs: symbol
  kind: feature
  task: 'Late penalties in earned() can take a score all the way to zero. Add a late_cap to the Policy
    (a fraction, default 0.5): the late penalty never removes more than that fraction of the points. load_policy
    should read it from the policy data when it''s there.'
  hidden: |
    from gradebook.book import Gradebook
    from gradebook.models import Assignment, Score, Student


    def make(*assignments, students=("s1",)):
        b = Gradebook()
        for sid in students:
            b.add_student(Student(sid, sid.upper()))
        for a in assignments:
            b.add_assignment(Assignment(*a))
        return b
    from gradebook.compute import final_percent
    from gradebook.policy import Policy, load_policy


    def test_late_cap() -> None:
        b = make(("h1", "H1", "homework", 10, "2026-09-01"))
        b.record(Score("s1", "h1", 10, late_days=4))
        default = load_policy({"weights": {"homework": 1.0}, "late_penalty": 0.2})
        assert round(final_percent(b, "s1", default), 1) == 50.0
        strict = load_policy({"weights": {"homework": 1.0}, "late_penalty": 0.2, "late_cap": 0.25})
        assert round(final_percent(b, "s1", strict), 1) == 75.0
        assert Policy(weights={"homework": 1.0}).late_cap == 0.5
        b.record(Score("s1", "h1", 10, late_days=1))
        assert round(final_percent(b, "s1", default), 1) == 80.0
  solution:
    gradebook/policy.py: |
      """How scores turn into a grade: category weights and the late penalty."""

      from dataclasses import dataclass, field
      from typing import Any


      @dataclass(frozen=True)
      class Policy:
          weights: dict[str, float]  # category -> weight; the weights add up to 1
          late_penalty: float = 0.1  # fraction of the points lost per late day
          drop_lowest: dict[str, int] = field(default_factory=dict)  # category -> how many to drop
          late_cap: float = 0.5  # the late penalty never takes more than this fraction of the points


      def load_policy(data: dict[str, Any]) -> Policy:
          weights = {str(k): float(v) for k, v in data["weights"].items()}
          if abs(sum(weights.values()) - 1.0) > 1e-6:
              raise ValueError("weights must add up to 1")
          return Policy(
              weights=weights,
              late_penalty=float(data.get("late_penalty", 0.1)),
              drop_lowest={str(k): int(v) for k, v in data.get("drop_lowest", {}).items()},
              late_cap=float(data.get("late_cap", 0.5)),
          )
    gradebook/compute.py: |
      """Turning scores into percentages and letters."""

      from gradebook.book import Gradebook
      from gradebook.models import Score
      from gradebook.policy import Policy


      def earned(score: Score, max_points: float, policy: Policy) -> float:
          """Points after the late penalty, never below zero."""
          penalty = min(
              score.points * policy.late_penalty * score.late_days, score.points * policy.late_cap
          )
          return max(0.0, score.points - penalty) / max_points


      def category_average(book: Gradebook, student_id: str, category: str, policy: Policy) -> float | None:
          """Mean fraction (0..1) over the graded assignments in a category; None if none are graded."""
          fractions = []
          for score in book.scores_for(student_id):
              assignment = book.assignments[score.assignment_id]
              if assignment.category == category:
                  fractions.append(earned(score, assignment.max_points, policy))
          if not fractions:
              return None
          return sum(fractions) / len(fractions)


      def final_percent(book: Gradebook, student_id: str, policy: Policy) -> float:
          total = 0.0
          for category, weight in policy.weights.items():
              avg = category_average(book, student_id, category, policy)
              if avg is not None:
                  total += avg * weight
          return total * 100


      def letter(percent: float) -> str:
          if percent >= 90:
              return "A"
          if percent >= 80:
              return "B"
          if percent >= 70:
              return "C"
          if percent >= 60:
              return "D"
          return "F"
- id: holdout-excused
