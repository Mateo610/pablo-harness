# The build set: "make me a small tool" requests for plan mode. Each one starts in a fresh, empty
# project; Pablo is asked to plan it, told to go, and each step is approved the way a person
# trusting the checks would (ready, or clean checks with a diff). When the plan finishes (or
# stops), `acceptance` runs in the final repo with `python -I -m pytest --noconftest`. The
# prompts name the interface the acceptance test uses, as a person would when asking.
#
# Like the suite, these runs happen in a throwaway home and are never training data.
# `solution` exists only for the self-test (tests/test_build_eval.py).
projects:
- id: build-units
  title: Units
  prompt: Let's build a small Python package called `convert` at the top level of the repo for unit conversion.
    `convert.convert(value, from_unit, to_unit)` converts lengths (m, km, cm, mi, ft, in) and temperatures
    (C, F, K) and raises ValueError for unknown units or for converting a length to a temperature. `python
    -m convert 5 km mi` prints the result rounded to 4 decimals. Include tests.
  acceptance: |
    import subprocess
    import sys

    import pytest

    from convert import convert


    def test_lengths() -> None:
        assert convert(1, "km", "m") == pytest.approx(1000)
        assert convert(1, "mi", "km") == pytest.approx(1.609344)
        assert convert(12, "in", "ft") == pytest.approx(1)


    def test_temperatures() -> None:
        assert convert(100, "C", "F") == pytest.approx(212)
        assert convert(32, "F", "C") == pytest.approx(0)
        assert convert(0, "K", "C") == pytest.approx(-273.15)


    def test_errors() -> None:
        with pytest.raises(ValueError):
            convert(1, "km", "C")
        with pytest.raises(ValueError):
            convert(1, "parsec", "m")


    def test_cli() -> None:
        out = subprocess.run([sys.executable, "-m", "convert", "5", "km", "mi"],
                             capture_output=True, text=True, check=True).stdout
        assert out.strip() == "3.1069"
  solution:
    convert/__init__.py: |
      """Unit conversion for lengths and temperatures."""

      LENGTHS = {"m": 1.0, "km": 1000.0, "cm": 0.01, "mi": 1609.344, "ft": 0.3048, "in": 0.0254}
      TEMPS = {"C", "F", "K"}


      def _to_kelvin(value: float, unit: str) -> float:
          if unit == "C":
              return value + 273.15
          if unit == "F":
              return (value - 32) * 5 / 9 + 273.15
          return value


      def _from_kelvin(value: float, unit: str) -> float:
          if unit == "C":
              return value - 273.15
          if unit == "F":
              return (value - 273.15) * 9 / 5 + 32
          return value


      def convert(value: float, from_unit: str, to_unit: str) -> float:
          if from_unit in LENGTHS and to_unit in LENGTHS:
              return value * LENGTHS[from_unit] / LENGTHS[to_unit]
          if from_unit in TEMPS and to_unit in TEMPS:
              return _from_kelvin(_to_kelvin(value, from_unit), to_unit)
          raise ValueError(f"can't convert {from_unit} to {to_unit}")
    convert/__main__.py: |
      import sys

      from convert import convert

      value, src, dst = sys.argv[1:4]
      print(f"{convert(float(value), src, dst):.4f}")
- id: build-todo
  title: Todo
  prompt: Let's build a tiny to-do list package called `todo` at the top level of the repo. A `todo.TodoList(path)`
    keeps items in a JSON file at `path` (created when missing). `add(title)` returns a new integer id
    (1, 2, 3, ...), `done(id)` marks it done (KeyError for an unknown id), `pending()` returns the titles
    not done yet in the order they were added, and everything survives making a new TodoList on the same
    path. Include tests.
  acceptance: |
    import pytest

    from todo import TodoList


    def test_round_trip(tmp_path) -> None:
        path = tmp_path / "todo.json"
        t = TodoList(path)
        assert t.add("milk") == 1 and t.add("eggs") == 2 and t.add("bread") == 3
        t.done(2)
        assert t.pending() == ["milk", "bread"]
        again = TodoList(path)
        assert again.pending() == ["milk", "bread"]
        assert again.add("jam") == 4


    def test_unknown_id(tmp_path) -> None:
        with pytest.raises(KeyError):
            TodoList(tmp_path / "t.json").done(7)
  solution:
    todo/__init__.py: |
      """A to-do list kept in a JSON file."""

      import json
      from pathlib import Path


      class TodoList:
          def __init__(self, path: str | Path) -> None:
              self.path = Path(path)
              self.items: list[dict] = json.loads(self.path.read_text()) if self.path.exists() else []

          def _save(self) -> None:
              self.path.write_text(json.dumps(self.items))

          def add(self, title: str) -> int:
              new_id = max((i["id"] for i in self.items), default=0) + 1
              self.items.append({"id": new_id, "title": title, "done": False})
              self._save()
              return new_id

          def done(self, item_id: int) -> None:
              for item in self.items:
                  if item["id"] == item_id:
                      item["done"] = True
                      self._save()
                      return
              raise KeyError(item_id)

          def pending(self) -> list[str]:
              return [i["title"] for i in self.items if not i["done"]]
- id: build-csvstats
  title: CSV stats
  prompt: Let's build a package called `csvstats` at the top level of the repo. `csvstats.summarize(path)`
    reads a CSV file with a header row and returns, for every column whose non-empty values are all numbers,
    a dict with count, mean, min and max (blank cells are skipped, not counted). Text columns are left
    out. Include tests.
  acceptance: |
    import pytest

    from csvstats import summarize


    def test_summary(tmp_path) -> None:
        f = tmp_path / "d.csv"
        f.write_text("name,age,score\nAna,30,9.5\nBen,,7\nCy,40,8.5\n")
        out = summarize(f)
        assert set(out) == {"age", "score"}
        assert out["age"]["count"] == 2 and out["age"]["mean"] == pytest.approx(35)
        assert out["age"]["min"] == 30 and out["age"]["max"] == 40
        assert out["score"]["count"] == 3 and out["score"]["mean"] == pytest.approx(25 / 3)
  solution:
    csvstats/__init__.py: |
      """Numeric column summaries for CSV files."""

      import csv
      from pathlib import Path


      def _number(text: str) -> float | None:
          try:
              return float(text)
          except ValueError:
              return None


      def summarize(path: str | Path) -> dict[str, dict[str, float]]:
          with open(path, newline="") as fh:
              rows = list(csv.DictReader(fh))
          out: dict[str, dict[str, float]] = {}
          for column in rows[0].keys() if rows else []:
              cells = [r[column].strip() for r in rows if r[column] and r[column].strip()]
              numbers = [_number(c) for c in cells]
              if not cells or any(n is None for n in numbers):
                  continue
              values = [n for n in numbers if n is not None]
              out[column] = {"count": len(values), "mean": sum(values) / len(values),
                             "min": min(values), "max": max(values)}
          return out
- id: build-ratelimit
  title: Rate limit
  prompt: Let's build a package called `ratelimit` at the top level of the repo with a token bucket. `ratelimit.TokenBucket(rate,
    capacity, clock=time.monotonic)` starts full; `allow()` takes one token and returns True, or returns
    False when the bucket is empty. Tokens refill continuously at `rate` per second up to `capacity`,
    using the clock you pass in (so tests can fake time). Include tests.
  acceptance: |
    from ratelimit import TokenBucket


    class Clock:
        def __init__(self) -> None:
            self.t = 100.0

        def __call__(self) -> float:
            return self.t


    def test_bucket() -> None:
        clock = Clock()
        b = TokenBucket(rate=2, capacity=3, clock=clock)
        assert [b.allow() for _ in range(4)] == [True, True, True, False]
        clock.t += 0.5
        assert b.allow() and not b.allow()
        clock.t += 10
        assert [b.allow() for _ in range(4)] == [True, True, True, False]
  solution:
    ratelimit/__init__.py: |
      """A token bucket."""

      import time
      from collections.abc import Callable


      class TokenBucket:
          def __init__(self, rate: float, capacity: float, clock: Callable[[], float] = time.monotonic):
              self.rate, self.capacity, self.clock = rate, capacity, clock
              self.tokens = float(capacity)
              self.at = clock()

          def allow(self) -> bool:
              now = self.clock()
              self.tokens = min(self.capacity, self.tokens + (now - self.at) * self.rate)
              self.at = now
              if self.tokens >= 1:
                  self.tokens -= 1
                  return True
              return False
- id: build-mdtoc
  title: Markdown TOC
  prompt: 'Let''s build a package called `mdtoc` at the top level of the repo. `mdtoc.toc(markdown)` returns
    a table of contents for the `#`, `##` and `###` headings: one line per heading, two spaces of indent
    per level below the first, as `- [Title](#anchor)`. Anchors are GitHub style: lowercase, spaces become
    hyphens, punctuation other than hyphens is dropped. Headings inside ``` code fences are ignored. Include
    tests.'
  acceptance: |
    from mdtoc import toc

    DOC = """# Pablo Guide

    Some text.

    ## Getting Started!

    ```
    # not a heading
    ```

    ### Install & run

    ## FAQ
    """


    def test_toc() -> None:
        assert toc(DOC).splitlines() == [
            "- [Pablo Guide](#pablo-guide)",
            "  - [Getting Started!](#getting-started)",
            "    - [Install & run](#install--run)",
            "  - [FAQ](#faq)",
        ]
  solution:
    mdtoc/__init__.py: |
      """A table of contents for markdown headings."""

      import re


      def anchor(title: str) -> str:
          text = re.sub(r"[^\w\- ]", "", title.lower())
          return text.replace(" ", "-")


      def toc(markdown: str) -> str:
          lines, fenced = [], False
          for line in markdown.splitlines():
              if line.strip().startswith("```"):
                  fenced = not fenced
                  continue
              m = re.match(r"^(#{1,3})\s+(.*?)\s*$", line)
              if m and not fenced:
                  level, title = len(m.group(1)), m.group(2)
                  lines.append(f"{'  ' * (level - 1)}- [{title}](#{anchor(title)})")
          return "\n".join(lines)
