  task: A discount below 0% or above 100% is a mistake. Raise ValueError for those instead of returning
    a price.
  hidden: |
    import pytest

    from inventory.pricing import discount


    def test_discount_range() -> None:
        for bad in (-1, 101, 250):
            with pytest.raises(ValueError):
                discount(1000, bad)
        assert discount(1000, 0) == 1000
        assert discount(1000, 100) == 0
  solution:
    inventory/pricing.py: |
      """Prices are integer cents."""


      def discount(price_cents: int, percent: int) -> int:
          if not 0 <= percent <= 100:
              raise ValueError(f"discount must be 0-100%, got {percent}")
          return price_cents - price_cents * percent // 100


      def bulk_price(price_cents: int, qty: int) -> int:
          """10% off each item when buying 10 or more."""
          if qty > 10:
              return discount(price_cents, 10) * qty
          return price_cents * qty
