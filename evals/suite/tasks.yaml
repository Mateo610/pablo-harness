- id: textkit-word-count
  repo: textkit
  refs: symbol
  kind: bugfix
  task: word_count overcounts when words are separated by more than one space, and it returns 1 for an
    empty string.
  hidden: |
    from textkit.stats import word_count


    def test_word_count() -> None:
        assert word_count("hello  world") == 2
        assert word_count("  hello world  ") == 2
        assert word_count("") == 0
        assert word_count("one") == 1
  solution:
    textkit/stats.py: |
      """Counting words."""


      def word_count(text: str) -> int:
          return len(text.split())


      def top_words(text: str, n: int) -> list[str]:
          """The n most frequent words, most frequent first."""
          counts: dict[str, int] = {}
          for word in text.lower().split():
              counts[word] = counts.get(word, 0) + 1
          return sorted(counts, key=lambda w: counts[w], reverse=True)[:n]
- id: textkit-slug-accents
  repo: textkit
  refs: file
  kind: feature
  task: 'In textkit/slug.py, slugify drops accented letters: ''Café au lait'' becomes ''caf-au-lait''.
    Fold accents to plain letters instead, so it becomes ''cafe-au-lait''.'
  hidden: |
    from textkit.slug import slugify


    def test_accents_fold() -> None:
        assert slugify("Café au lait") == "cafe-au-lait"
        assert slugify("Über Straße") in ("uber-strasse", "uber-strae", "uber-stra-e")
        assert slugify("Hello, World!") == "hello-world"
  solution:
    textkit/slug.py: |
      """URL slugs."""

      import re
      import unicodedata


      def slugify(text: str) -> str:
          """'Hello, World!' -> 'hello-world'."""
          folded = unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode("ascii")
          words = re.findall(r"[a-z0-9]+", folded.lower())
          return "-".join(words)
- id: textkit-top-words-punctuation
  repo: textkit
  refs: none
  kind: bugfix
  task: Counting the most common words treats 'Apple,' and 'apple' as different words. Ignore punctuation
    around words when counting.
  hidden: |
    from textkit.stats import top_words


    def test_punctuation_is_ignored() -> None:
        assert top_words("Apple, apple; APPLE. pear!", 1) == ["apple"]
        assert top_words("Apple, apple; APPLE. pear!", 2) == ["apple", "pear"]
  solution:
    textkit/stats.py: |
      """Counting words."""


      def word_count(text: str) -> int:
          return len(text.split(" "))


      def top_words(text: str, n: int) -> list[str]:
          """The n most frequent words, most frequent first."""
          counts: dict[str, int] = {}
          for raw in text.lower().split():
              word = raw.strip(".,;:!?\"'()[]")
              if word:
                  counts[word] = counts.get(word, 0) + 1
          return sorted(counts, key=lambda w: counts[w], reverse=True)[:n]
- id: textkit-wrap-max-lines
  repo: textkit
  refs: symbol
  kind: feature
  task: Add an optional max_lines argument to wrap. When the text needs more lines than that, keep the
    first max_lines lines and add '...' to the end of the last one kept (it may then be longer than width).
    Without max_lines, nothing changes.
  hidden: |
    from textkit.wrap import wrap


    def test_max_lines() -> None:
        assert wrap("a b c d e f", 3, max_lines=2) == ["a b", "c d..."]
        assert wrap("a b c d", 3, max_lines=2) == ["a b", "c d"]
        assert wrap("a b c d e f", 3) == ["a b", "c d", "e f"]
  solution:
    textkit/wrap.py: |
      """Fitting text into a width."""


      def wrap(text: str, width: int, max_lines: int | None = None) -> list[str]:
          """Greedy word wrap. A word longer than width gets a line of its own."""
          lines: list[str] = []
          line = ""
          for word in text.split():
              if line and len(line) + 1 + len(word) > width:
                  lines.append(line)
                  line = word
              else:
                  line = f"{line} {word}" if line else word
          if line:
              lines.append(line)
          if max_lines is not None and len(lines) > max_lines:
              lines = lines[:max_lines]
              lines[-1] += "..."
          return lines


      def truncate(text: str, limit: int) -> str:
          """Cut to `limit` characters and add '...' when anything was cut."""
          if len(text) <= limit:
              return text
          return text[:limit] + "..."
- id: textkit-truncate-words
  repo: textkit
  refs: none
  kind: feature
  task: Shortening text should not cut a word in half. Cut at the last space before the limit when there
    is one, then add '...'. Text that already fits stays as it is.
  hidden: |
    from textkit.wrap import truncate


    def test_cuts_at_a_space() -> None:
        assert truncate("hello big world", 10) == "hello big..."
        assert truncate("abcdefghij", 4) == "abcd..."
        assert truncate("short", 10) == "short"
  solution:
    textkit/wrap.py: |
      """Fitting text into a width."""


      def wrap(text: str, width: int) -> list[str]:
          """Greedy word wrap. A word longer than width gets a line of its own."""
          lines: list[str] = []
          line = ""
          for word in text.split():
              if line and len(line) + 1 + len(word) > width:
                  lines.append(line)
                  line = word
              else:
                  line = f"{line} {word}" if line else word
          if line:
              lines.append(line)
          return lines


      def truncate(text: str, limit: int) -> str:
          """Cut to `limit` characters and add '...' when anything was cut."""
          if len(text) <= limit:
              return text
          cut = text[:limit]
          space = cut.rfind(" ")
          if space > 0:
              cut = cut[:space]
          return cut + "..."
