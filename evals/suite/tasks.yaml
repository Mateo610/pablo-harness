# The M7 coder eval suite: 30 tasks on three small repos (evals/suite/repos), plus 6 on a pinned
# commit of this harness (`seeds.harness`), big enough that finding the code is part of the work.
# Harness hidden tests put src/ on sys.path themselves, since they run with `python -I`.
#
# The model sees only `task` and the repo. `hidden` is a test it never sees: after the run, the
# diff is applied to a fresh copy, the hidden test is written next to it, and it runs with
# `python -I -m pytest --noconftest`, so a conftest.py, sitecustomize.py, or patched import the
# diff adds cannot make it pass. A task passes when the hidden test passes.
#
# `refs` says how the task points at the code: `file` names a path, `symbol` names a function or
# class, `none` only describes behavior. That split is what M6's context work should move.
# `solution` is one correct answer, used only by the self-test (tests/test_suite.py) to prove each
# hidden test fails on the base repo and passes on a real fix. Never show it to a model.
#
# These tasks and their runs are never training data: `pablo eval` runs in a throwaway home.
seeds:
  harness:
    git: 7cc54b1f30c468376ad7bae0a4b410af4c3a0e90
    exclude:
    - evals/suite
    - evals/holdout
    - tests/test_suite.py
    - tests/test_holdout.py
tasks:
- id: ledger-by-payee-sums
  repo: ledger
  refs: file
  kind: bugfix
  task: In ledger/report.py, by_payee keeps only the last amount for each payee. It should add them up.
  hidden: |
    from ledger.entries import load
    from ledger.report import by_payee


    def test_by_payee_adds_up() -> None:
        entries = load("2026-11-01, Cafe, $1.50\n2026-11-02, Cafe, $2.00\n2026-11-02, Grocer, $5.00\n")
        assert by_payee(entries) == {"Cafe": 350, "Grocer": 500}
  solution:
    ledger/report.py: |
      """Totals and summaries."""

      from ledger.entries import Entry, in_month
      from ledger.money import format_cents


      def total(entries: list[Entry]) -> int:
          return sum(e.cents for e in entries)


      def monthly(entries: list[Entry], month: str) -> str:
          chosen = [e for e in entries if in_month(e, month)]
          return f"{month} {format_cents(total(chosen))}"


      def by_payee(entries: list[Entry]) -> dict[str, int]:
          out: dict[str, int] = {}
          for e in entries:
              out[e.payee] = out.get(e.payee, 0) + e.cents
          return out
- id: ledger-load-line-commas
  repo: ledger
  refs: symbol
  kind: bugfix
  task: load_line breaks when the payee contains a comma, for example '2026-11-02, Cafe, Main St, $1.50'.
    The day is the first field, the amount is the last, and the payee is everything in between.
  hidden: |
    from ledger.entries import Entry, load_line


    def test_payee_with_commas() -> None:
        assert load_line("2026-11-02, Cafe, Main St, $1.50") == Entry("2026-11-02", "Cafe, Main St", 150)
        assert load_line("2026-11-02, Cafe, $1.50") == Entry("2026-11-02", "Cafe", 150)
  solution:
    ledger/entries.py: |
      """One entry per line: 'YYYY-MM-DD, payee, $amount'."""

      from dataclasses import dataclass

      from ledger.money import parse_dollars


      @dataclass(frozen=True)
      class Entry:
          day: str
          payee: str
          cents: int


      def load_line(line: str) -> Entry:
          parts = line.split(",")
          day, dollars = parts[0], parts[-1]
          payee = ",".join(parts[1:-1])
          return Entry(day.strip(), payee.strip(), parse_dollars(dollars))


      def load(text: str) -> list[Entry]:
          return [load_line(line) for line in text.splitlines() if line.strip()]


      def in_month(entry: Entry, month: str) -> bool:
          """month is 'YYYY-MM'."""
          return entry.day[:7] == month
- id: ledger-negative-format
  repo: ledger
  refs: none
  kind: bugfix
  task: 'Refunds print wrong: an amount of -150 cents shows as $-2.50. It should show -$1.50.'
  hidden: |
    from ledger.money import format_cents


    def test_negative_amounts() -> None:
        assert format_cents(-150) == "-$1.50"
        assert format_cents(-5) == "-$0.05"
        assert format_cents(150) == "$1.50"
        assert format_cents(0) == "$0.00"
  solution:
    ledger/money.py: |
      """Money is kept in integer cents."""


      def parse_dollars(text: str) -> int:
          """'$1.50' -> 150."""
          clean = text.strip().lstrip("$")
          dollars, _, cents = clean.partition(".")
          return int(dollars) * 100 + int((cents + "00")[:2])


      def format_cents(cents: int) -> str:
          """150 -> '$1.50'."""
          sign = "-" if cents < 0 else ""
          cents = abs(cents)
          return f"{sign}${cents // 100}.{cents % 100:02d}"
- id: ledger-thousands
  repo: ledger
  refs: symbol
  kind: feature
  task: parse_dollars should accept thousands separators, like '$1,234.50'.
  hidden: |
    from ledger.money import parse_dollars


    def test_thousands_separators() -> None:
        assert parse_dollars("$1,234.50") == 123450
        assert parse_dollars("$1,000,000") == 100000000
        assert parse_dollars("$1.50") == 150
  solution:
    ledger/money.py: |
      """Money is kept in integer cents."""


      def parse_dollars(text: str) -> int:
          """'$1.50' -> 150."""
          clean = text.strip().lstrip("$").replace(",", "")
          dollars, _, cents = clean.partition(".")
          return int(dollars) * 100 + int((cents + "00")[:2])


      def format_cents(cents: int) -> str:
          """150 -> '$1.50'."""
          return f"${cents // 100}.{cents % 100:02d}"
