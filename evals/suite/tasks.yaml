- id: textkit-slug-max-length
  repo: textkit
  refs: symbol
  kind: feature
  task: slugify should take an optional max_length. Never cut in the middle of a word or leave a trailing
    hyphen; if the first word alone is longer than max_length, cut that word at max_length.
  hidden: |
    from textkit.slug import slugify


    def test_max_length() -> None:
        assert slugify("Hello big world", max_length=10) == "hello-big"
        assert slugify("Hello big world", max_length=9) == "hello-big"
        assert slugify("Hello big world", max_length=8) == "hello"
        assert slugify("abcdefghij", max_length=4) == "abcd"
        assert slugify("Hello big world") == "hello-big-world"
  solution:
    textkit/slug.py: |
      """URL slugs."""

      import re


      def slugify(text: str, max_length: int | None = None) -> str:
          """'Hello, World!' -> 'hello-world'."""
          words = re.findall(r"[a-z0-9]+", text.lower())
          slug = "-".join(words)
          if max_length is None or len(slug) <= max_length:
              return slug
          kept = ""
          for word in words:
              candidate = f"{kept}-{word}" if kept else word
              if len(candidate) > max_length:
                  break
              kept = candidate
          return kept or words[0][:max_length]
- id: textkit-reading-time
  repo: textkit
  refs: symbol
  kind: feature
  task: 'Add reading_time(text) next to word_count: whole minutes at 200 words per minute, rounded up,
    and 0 for empty or blank text.'
  hidden: |
    from textkit.stats import reading_time


    def test_reading_time() -> None:
        assert reading_time("") == 0
        assert reading_time("   ") == 0
        assert reading_time("word " * 200) == 1
        assert reading_time("word " * 201) == 2
        assert reading_time("a  b") == 1
  solution:
    textkit/stats.py: |
      """Counting words."""


      def word_count(text: str) -> int:
          return len(text.split(" "))


      def top_words(text: str, n: int) -> list[str]:
          """The n most frequent words, most frequent first."""
          counts: dict[str, int] = {}
          for word in text.lower().split():
              counts[word] = counts.get(word, 0) + 1
          return sorted(counts, key=lambda w: counts[w], reverse=True)[:n]


      def reading_time(text: str) -> int:
          words = len(text.split())
          return -(-words // 200)
- id: textkit-top-words-ties
  repo: textkit
  refs: file
  kind: bugfix
  task: In textkit/stats.py, top_words returns words with the same count in the order they first appeared.
    Break ties alphabetically.
  hidden: |
    from textkit.stats import top_words


    def test_ties_are_alphabetical() -> None:
        assert top_words("b a b a c", 2) == ["a", "b"]
        assert top_words("z y x", 3) == ["x", "y", "z"]
        assert top_words("b a b", 2) == ["b", "a"]
  solution:
    textkit/stats.py: |
      """Counting words."""


      def word_count(text: str) -> int:
          return len(text.split(" "))


      def top_words(text: str, n: int) -> list[str]:
          """The n most frequent words, most frequent first."""
          counts: dict[str, int] = {}
          for word in text.lower().split():
              counts[word] = counts.get(word, 0) + 1
          return sorted(counts, key=lambda w: (-counts[w], w))[:n]
