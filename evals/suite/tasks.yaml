- id: ledger-month-number
  repo: ledger
  refs: symbol
  kind: feature
  task: in_month should also accept a bare month number like '11', meaning November of any year. Do not
    change what it returns for a 'YYYY-MM' month.
  hidden: |
    from ledger.entries import Entry, in_month

    NOV = Entry("2026-11-05", "Cafe", 150)


    def test_bare_month_number() -> None:
        assert in_month(NOV, "11")
        assert not in_month(NOV, "10")


    def test_year_month_unchanged() -> None:
        assert in_month(NOV, "2026-11")
        assert not in_month(NOV, "2025-11")
        assert not in_month(NOV, "2026-1")
  solution:
    ledger/entries.py: |
      """One entry per line: 'YYYY-MM-DD, payee, $amount'."""

      from dataclasses import dataclass

      from ledger.money import parse_dollars


      @dataclass(frozen=True)
      class Entry:
          day: str
          payee: str
          cents: int


      def load_line(line: str) -> Entry:
