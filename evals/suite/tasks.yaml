- id: ledger-refunds-parse
  repo: ledger
  refs: none
  kind: feature
  task: Refunds are written with a leading minus, like '-$2.00'. Loading one currently crashes. Make it
    parse to -200 cents.
  hidden: |
    from ledger.entries import load_line
    from ledger.money import parse_dollars


    def test_refunds_parse() -> None:
        assert parse_dollars("-$2.00") == -200
        assert parse_dollars("-$0.25") == -25
        assert parse_dollars("$2.00") == 200
        assert load_line("2026-11-04, Shop, -$3.10").cents == -310
  solution:
    ledger/money.py: |
      """Money is kept in integer cents."""


      def parse_dollars(text: str) -> int:
          """'$1.50' -> 150."""
          clean = text.strip()
          sign = -1 if clean.startswith("-") else 1
          clean = clean.lstrip("-").lstrip("$")
          dollars, _, cents = clean.partition(".")
          return sign * (int(dollars) * 100 + int((cents + "00")[:2]))


      def format_cents(cents: int) -> str:
          """150 -> '$1.50'."""
          return f"${cents // 100}.{cents % 100:02d}"
