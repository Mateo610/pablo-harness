- id: inventory-store-csv
  repo: inventory
  refs: symbol
  kind: feature
  task: Add Store.to_csv() and a Store.from_csv(text) classmethod that use the existing load_csv and dump_csv
    helpers, so a whole store can be saved and loaded.
  hidden: |
    from inventory.models import Item
    from inventory.store import Store


    def test_store_round_trip() -> None:
        store = Store()
        store.add(Item("B1", "Bolt, hex", 25, 100))
        store.add(Item("N1", 'Nut "M6"', 10, 3))
        again = Store.from_csv(store.to_csv())
        assert again.items == store.items
  solution:
    inventory/store.py: |
      from inventory.csvio import dump_csv, load_csv
      from inventory.models import Item


      class Store:
          def __init__(self) -> None:
              self.items: dict[str, Item] = {}

          def add(self, item: Item) -> None:
              self.items[item.sku] = item

          def remove(self, sku: str, qty: int) -> None:
              item = self.items[sku]
              item.qty -= qty

          def find(self, text: str) -> list[Item]:
              return [i for i in self.items.values() if text in i.name]

          def value_cents(self) -> int:
              return sum(i.price_cents for i in self.items.values())

          def to_csv(self) -> str:
              return dump_csv(list(self.items.values()))

          @classmethod
          def from_csv(cls, text: str) -> "Store":
              store = cls()
              for item in load_csv(text):
                  store.add(item)
              return store
