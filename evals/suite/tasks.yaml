- id: inventory-csv-lenient
  repo: inventory
  refs: symbol
  kind: feature
  task: load_csv should treat a missing qty column as 0 and ignore spaces around values.
  hidden: |
    from inventory.csvio import load_csv
    from inventory.models import Item


    def test_lenient_csv() -> None:
        text = "sku,name,price_cents\n A1 , Bolt , 25 \n"
        assert load_csv(text) == [Item("A1", "Bolt", 25, 0)]
        full = "sku,name,price_cents,qty\nA1,Bolt,25, 4\n"
        assert load_csv(full) == [Item("A1", "Bolt", 25, 4)]
  solution:
    inventory/csvio.py: |
      import csv
      import io

      from inventory.models import Item


      def load_csv(text: str) -> list[Item]:
          rows = csv.DictReader(io.StringIO(text))
          items = []
          for row in rows:
              r = {k.strip(): (v or "").strip() for k, v in row.items() if k}
              items.append(Item(r["sku"], r["name"], int(r["price_cents"]), int(r.get("qty") or 0)))
          return items


      def dump_csv(items: list[Item]) -> str:
          out = io.StringIO()
          writer = csv.writer(out, lineterminator="\n")
          writer.writerow(["sku", "name", "price_cents", "qty"])
          for i in items:
              writer.writerow([i.sku, i.name, i.price_cents, i.qty])
          return out.getvalue()
