# Judge fixtures: does the judge tell good changes from bad ones?
# Each case rewrites files in ./repo; the eval turns that into a git diff, runs the
# checks, then asks the judge. `expect: good` should score >= threshold, `bad` below it.
# Several bad cases PASS the tests on purpose: the judge has to read the diff,
# not just echo the test results.

cases:
  - id: good-slugify
    expect: good
    task: Add a slugify(text) helper that lowercases and joins words with hyphens, with tests.
    files:
      textutils.py: |
        """Small text helpers used by the judge fixtures."""

        import re


        def word_count(text: str) -> int:
            return len(text.split(" "))


        def truncate(text: str, limit: int) -> str:
            if len(text) <= limit:
                return text
            return text[:limit] + "..."


        def slugify(text: str) -> str:
            words = re.findall(r"[a-z0-9]+", text.lower())
            return "-".join(words)
      test_textutils.py: |
        from textutils import slugify, truncate, word_count


        def test_word_count_simple() -> None:
            assert word_count("hello world") == 2


        def test_truncate_short_text_unchanged() -> None:
            assert truncate("hi", 10) == "hi"


        def test_truncate_long_text() -> None:
            assert truncate("abcdefghij", 4) == "abcd..."


        def test_slugify() -> None:
            assert slugify("Hello, World!") == "hello-world"
            assert slugify("  Pablo   Harness 2 ") == "pablo-harness-2"
            assert slugify("") == ""

