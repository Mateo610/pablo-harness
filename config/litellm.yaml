# LiteLLM gateway: one OpenAI-compatible door for every lane.
# Start on Pablo:  litellm --config config/litellm.yaml --host 127.0.0.1 --port 4000
#
# Router, coder, and judge go through llama-swap on 127.0.0.1:8100. The model
# name in the request (router, coder, judge) picks the lane. The swapper keeps
# the router resident on CPU and swaps coder and judge on the GPU.
# Deep stays on 8004 until a model that fits is chosen. Nothing listens there yet.
#
#   8100  swapper llama-swap (router, coder, judge)          M4
#   8004  deep    not served                                     M3
#   8005  media   media dispatcher (Qwen-Image, TRELLIS.2)       M9

model_list:
  - model_name: pablo/router
    litellm_params:
      model: openai/router
      api_base: http://127.0.0.1:8100/v1
      api_key: "none"

  - model_name: pablo/coder
    litellm_params:
      model: openai/coder
      api_base: http://127.0.0.1:8100/v1
      api_key: "none"

  - model_name: pablo/judge
    litellm_params:
      model: openai/judge
      api_base: http://127.0.0.1:8100/v1
      api_key: "none"

  - model_name: pablo/deep
    litellm_params:
      model: openai/deep
      api_base: http://127.0.0.1:8004/v1   # M4b: move to the swapper on :8100
      api_key: "none"
      timeout: 3600                        # deep thinks for a long time; lanes.yaml matches

  - model_name: pablo/media
    litellm_params:
      model: openai/media
      api_base: http://127.0.0.1:8005/v1
      api_key: "none"

  # Escalation only. The harness refuses to call this lane unless you escalate,
  # and its traces are never exported for training (Anthropic's terms).
  - model_name: pablo/escalate
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/PABLO_GATEWAY_KEY

litellm_settings:
  telemetry: false
  drop_params: true
  request_timeout: 900
