# llama-swap on 127.0.0.1:8100. The router stays on CPU. Coder, judge, and deep
# share the GPU. The coder is the default resident (preloaded). Deep is gpt-oss-120b
# MXFP4: --n-cpu-moe 25 and -c 65536. N=24 cannot allocate the 64k KV cache.
# The M4b bake-off did not keep the lane. The model stays so an explicit deep
# run still loads.
#
# `exclusive: false` on the GPU group is deliberate. exclusive unloads every other
# group, which would evict the router. Only one member of `gpu` is resident
# because `swap: true`.

healthCheckTimeout: 180
startPort: 8010

hooks:
  on_startup:
    preload:
      - router
      - coder

models:
  router:
    ttl: 0
    proxy: http://127.0.0.1:${PORT}
    cmd: >-
      /home/mateo610/pablo-data/engines/llama.cpp/build/bin/llama-server
      -m /home/mateo610/pablo-data/models/qwen3.5-4b/Qwen3.5-4B-Q4_K_M.gguf
      --host 127.0.0.1 --port ${PORT}
      -c 16384 -ngl 0
      --jinja
      --reasoning off
      --alias router

  coder:
    ttl: 0
    proxy: http://127.0.0.1:${PORT}
    # Wrapper adds --lora when $PABLO_DATA/adapters/coder-active/adapter.gguf exists.
    cmd: >
      /home/mateo610/Desktop/pablo-harness/pablo-harness-main/scripts/llama-coder.sh
      ${PORT}

  coder-candidate:
    ttl: 0
    proxy: http://127.0.0.1:${PORT}
    cmd: >
      /home/mateo610/Desktop/pablo-harness/pablo-harness-main/scripts/llama-coder-candidate.sh
      ${PORT}

  judge:
    ttl: 0
    proxy: http://127.0.0.1:${PORT}
    cmd: >-
      /home/mateo610/pablo-data/engines/llama.cpp/build/bin/llama-server
      -m /home/mateo610/pablo-data/models/mistral-small-3.2-24b-heretic/Mistral-Small-3.2-24B-Instruct-2506-ultra-uncensored-heretic-Q5_K_M.gguf
      --host 127.0.0.1 --port ${PORT}
      -c 16384 -ngl 99
      --flash-attn on
      --jinja
      --alias judge

  deep:
    ttl: 0
    proxy: http://127.0.0.1:${PORT}
    cmd: >-
      /home/mateo610/pablo-data/engines/llama.cpp/build/bin/llama-server
      -m /home/mateo610/pablo-data/models/gpt-oss-120b/gpt-oss-120b-MXFP4.gguf
      --host 127.0.0.1 --port ${PORT}
      -c 65536 -ngl 99
      --n-cpu-moe 25
      --flash-attn on
      --jinja
      --reasoning on
      --reasoning-effort high
      --alias deep

routing:
  router:
    use: group
    settings:
      groups:
        cpu:
          persistent: true
          swap: false
          exclusive: false
          members:
            - router
        gpu:
          swap: true
          exclusive: false
          members:
            - coder
            - coder-candidate
            - judge
            - deep
