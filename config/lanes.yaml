# Lanes: who on the team does what.
# `model` is the alias LiteLLM serves (see config/litellm.yaml), so swapping a model
# never touches harness code. `train_ok: false` means traces from that lane are
# never used as training data (Claude's terms forbid training on its outputs).

gateway:
  base_url: http://127.0.0.1:4000/v1
  api_key_env: PABLO_GATEWAY_KEY

thresholds:
  judge_needs_you: 0.75   # below this certainty, the item lands in "Needs you"

projects:                 # every git repo in root is a project; new ones are made here
  root: ~/projects

gpu:                      # one GPU, many people (src/pablo/gpu.py)
  mode: balanced          # interactive · balanced · deep; the switch on Home overrides it
  idle_s: 120             # balanced: retries and night work wait this long after live activity
  # Residents: GPU processes outside llama-swap. The voice server can't share the 3090 with
  # deep, so it's paused before deep loads and woken (after unloading deep) on a voice turn.
  unload_url: http://127.0.0.1:8100/unload   # llama-swap: drop whatever model is loaded
  residents:
    - name: tts
      start: systemctl --user start pablo-tts.service
      stop: systemctl --user stop pablo-tts.service
      health: http://127.0.0.1:8880          # any HTTP answer means it is up
      conflicts: [pablo/deep]
      warmup_s: 90

chat:                     # chat prompt layout (src/pablo/convos.py)
  stable_prefix: false    # true: per-message context rides on the message so llama.cpp reuses its cache

learn:                    # learning without retraining (src/pablo/lessons.py); recording is always on
  examples: false         # show the coder 1 or 2 right answers from this repo
  failures: false         # warn the coder what broke on similar changes before
  routing: false          # send a kind of task to deep when deep clearly does better here

practice:                 # nightly checkable tasks from your repos (src/pablo/practice.py)
  repos: []               # e.g. [~/code/clipfarmers]; never the eval suite's repos
  nightly_tasks: 0        # 0 = off
  teacher: deep           # tries what the coder missed; "" for none

spec:                     # task-derived checks: tests from your request, written before the diff is seen
  enabled: false          # M7d: false alarms averaged 2 per run, over the limit of 1
  lane: judge             # who writes them (the judge model is already loaded at that moment)

voice:                    # M9b. Both engines are local processes; empty URLs turn voice off.
  stt_url: http://127.0.0.1:8090   # whisper.cpp small.en, CPU threads 4-7
  stt_api: whisper.cpp    # whisper.cpp (POST /inference) or openai (/v1/audio/transcriptions)
  tts_url: http://127.0.0.1:8880   # Qwen3-TTS 0.6B CustomVoice
  tts_model: qwen3-tts
  tts_format: wav
  voices:
    coder: Vivian            # bright young female preset
    advisor: Serena          # warm young female preset
  language: en

overnight:                # Pablo's local time
  start: "01:00"          # queued jobs run between start and end, one at a time
  end: "06:30"
  brief_at: "07:30"       # morning brief written after this time
  default_lane: deep      # lane for queued tasks that don't name one
  max_jobs: 8

sandbox:                  # where checks run (model-written code runs here)
  kind: container         # container on Pablo; tests, CI, and --fake use local
  engine: podman          # rootless podman: no root daemon, no docker group
  runtime: runsc          # gVisor; "" falls back to the engine's default runtime
  image: pablo-check:py311
  memory: 4g
  cpus: 4
  cpu_set: "12-15"        # one thread each of cores 4-7; cores 0-3 stay free for llama.cpp
  pids: 256
  tmpfs_mb: 512

lanes:
  router:
    role: Classifies each task and picks a lane
    model: pablo/router          # Qwen3.5-4B Q4, always loaded on CPU
    display: Qwen3.5 4B
    color: "#8fa7c2"
    kind: local
    gpu: false                   # CPU: never waits for the GPU scheduler
    train_ok: true

  coder:
    role: Daily coding, diffs, tests
    model: pablo/coder           # Qwen3.6 35B-A3B
    display: Qwen3.6 35B-A3B
    color: "#4fd1bc"
    kind: local
    train_ok: true
    keywords: [code, bug, test, refactor, function, api, diff, fix, implement, python, typescript]
    edit_format: blocks          # find-and-replace blocks; git writes the diff (or: diff)
    writes_code: true
    symbol_lookup: false         # M6 two-step: not a keep (84% ± 2%, false ready 7 vs 4); code stays
    retry_on: deep               # a coder run that needs you gets a fresh try on deep (M7: 94% vs 82%)
    retry_when: now              # now · overnight (queue it for the window) · off
    retry_if: broken             # broken: only failed / no diff / didn't apply / checks worse · needs_you: any

  coder-candidate:
    role: LoRA candidate under eval; never auto-routed, never training data
    model: pablo/coder-candidate
    display: Qwen3.6 35B-A3B + LoRA
    color: "#3aa896"
    kind: local
    train_ok: false
    routable: false
    edit_format: blocks
    writes_code: true
    symbol_lookup: false         # mirrors coder: the only difference under test is the adapter

  judge:
    role: Reviews diffs and scores certainty
    model: pablo/judge           # Qwen3.8-27B UD-Q4_K_M via judge-qwen-dense; threshold 0.75
    display: Qwen3.8 27B
    color: "#b9a3ff"
    kind: local
    train_ok: true

  advisor:
    role: Unfiltered second opinion; talks, never edits, never scores
    model: pablo/advisor         # Mistral-Small-3.2-24B heretic Q5 (the old judge's weights)
    display: Mistral Small 3.2 24B heretic
    color: "#b9a3ff"
    kind: local
    train_ok: false              # no-guardrails output never becomes training data
    writes_code: false
    routable: false              # only when you pick it (Chat model menu, Advisor tab, voice)
    fix_rounds: 0
    temperature: 0.7
    max_tokens: 2048

  deep:
    role: Long, hard reasoning; overnight sweeps
    model: pablo/deep            # gpt-oss-120b MXFP4, --n-cpu-moe 25, ctx 65536. Bake-off did not keep the lane.
    display: gpt-oss-120b
    color: "#f28fa8"
    kind: local
    train_ok: true
    keywords: [architecture, design doc, prove, strategy, research, plan]
    writes_code: true            # overnight refactors come back as verified diffs
    max_tokens: 32768            # reasoning tokens count against this
    timeout_s: 3600
    routable: false              # M4c: by hand, compare, overnight, or a retry; never auto-routed
    context_tokens: 24000        # 65536 window - 32768 reply, with room for ~4 chars/token being optimistic on code
    temperature: 1.0             # gpt-oss card; other lanes stay at 0.2
    top_p: 1.0

  media:
    role: Images, 3D, motion, video
    model: pablo/media           # dispatches to Qwen-Image / TRELLIS.2 / LTX workers
    display: Qwen-Image · TRELLIS.2
    color: "#c4db72"
    kind: local
    train_ok: false              # media pipelines are not chat-trainable
    keywords: [image, render, 3d, mesh, blender, video, animation, logo]

  claude:
    role: Escalation only, never automatic
    model: pablo/escalate        # Anthropic API through the gateway
    display: Claude
    writes_code: true
    color: "#d9cfc2"
    kind: remote
    train_ok: false              # hard rule, enforced in code too
    requires_approval: true
