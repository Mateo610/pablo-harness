[project]
name = "pablo-harness"
version = "0.1.0.dev0"
description = "A private cockpit for a team of local AI models: route, verify, judge, and learn on your own hardware."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Matt Kraus" }]
dependencies = [
  "textual>=0.80",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tree-sitter>=0.24",
  "tree-sitter-python>=0.23",
]

[project.scripts]
pablo = "pablo.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pablo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]  # the typographic minus in "+118 −9" is intentional

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pablo"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["container: needs podman (or docker) and the pablo-check image; run on Pablo"]
